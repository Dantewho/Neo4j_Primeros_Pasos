<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/neo4j.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primeros Pasos con Neo4j</title>
  </head>
  <body>
    <!-- Login View -->
    <main id="login-view" class="page">
      <section class="login-card" aria-label="Login">
        <div class="card-inner">
          <label class="field-label" for="username">Usuario:</label>

          <input
            id="username"
            class="field-input"
            type="text"
            placeholder="Ingrese su usuario"
            autocomplete="off"
            spellcheck="false"
          />

          <button id="loginBtn" class="btn" type="button">Iniciar Sesion</button>
          <div id="mensaje"></div>
        </div>
      </section>
    </main>

    <!-- Friends View -->
    <div id="friends-view" style="display: none;">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="welcome" id="welcomeText">Welcome Back, User!</div>

          <button id="logoutBtn" class="btn" type="button">Cerrar Sesion</button>
        </div>
        <div class="rainbow-line" aria-hidden="true"></div>
      </header>

      <main class="page">
        <section class="friends-card" aria-label="Friends list">
          <div class="friends-inner" id="friendsList"></div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
